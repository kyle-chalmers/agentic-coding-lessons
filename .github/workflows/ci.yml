name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.22.0
      - name: Install ripgrep and gitleaks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLo gitleaks_checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_checksums.txt | sed 's/ .*//' > expected.sha256
          echo "$(cat expected.sha256)  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm -f gitleaks.tgz gitleaks_checksums.txt expected.sha256
      - name: verify (CI mode)
        run: bash scripts/verify.sh
